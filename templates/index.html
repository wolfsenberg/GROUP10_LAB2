<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Commitly - Commit. Collaborate. Create."/>
    <title>Commitly - Login & Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Kode+Mono:wght@400..700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>
  <!-- REYES-LOGIN-1 -->
  <body>
    <div class="container">
      <header class="site-section">
        <h1>Commitly</h1>
        <p class="tagline">Commit. Collaborate. Create.</p>
        <p class="member-names">BY BARLAM · CALING · DUNGAO · RABAGO · REYES</p>
      </header>

      <main class="form-section">
        <div class="form-container">
          <nav class="form-tabs">
            <button class="tab-btn active" data-tab="login">Login</button>
            <button class="tab-btn" data-tab="register">Register</button>
          </nav>

          <form id="loginForm" class="form active">
            <h2>Welcome Back!</h2>

            <fieldset>
              <legend>Login Credentials</legend>

              <div class="form-group">
                <label for="loginEmail" class="form-label">Email</label>
                <input
                  type="email"
                  id="loginEmail"
                  name="email"
                  class="form-input"
                  placeholder="your@email.com"
                  autocomplete="email"
                  required
                />
              </div>

              <div class="form-group">
                <label for="loginPassword" class="form-label">Password</label>
                <input
                  type="password"
                  id="loginPassword"
                  name="password"
                  class="form-input"
                  placeholder="Enter your password"
                  autocomplete="current-password"
                  required
                />
              </div>

              <div class="remember-me">
                <input
                  type="checkbox"
                  id="rememberMe"
                  name="rememberMe"
                  class="form-checkbox"
                />
                <label for="rememberMe" class="checkbox-label"
                  >Remember me</label
                >
              </div>

              <button type="submit" class="submit-btn">Login</button>
            </fieldset>

            <p class="form-message" id="loginMessage"></p>
          </form>
          <!-- BARLAM-REGISTER-1 -->
          <form id="registerForm" class="form">
            <h2>Join Commitly!</h2>

            <fieldset>
              <legend>Registration Information</legend>

              <div class="form-group">
                <label for="registerName" class="form-label">Full Name</label>
                <input
                  type="text"
                  id="registerName"
                  name="fullname"
                  class="form-input"
                  placeholder="Your name"
                  autocomplete="name"
                  required
                />
              </div>

              <div class="form-group">
                <label for="registerEmail" class="form-label">Email</label>
                <input
                  type="email"
                  id="registerEmail"
                  name="email"
                  class="form-input"
                  placeholder="your@email.com"
                  autocomplete="email"
                  required
                />
              </div>

              <div class="form-group">
                <label for="registerPassword" class="form-label"
                  >Password</label
                >
                <input
                  type="password"
                  id="registerPassword"
                  name="password"
                  class="form-input"
                  placeholder="Create a password"
                  autocomplete="new-password"
                  minlength="6"
                  required
                />
              </div>

              <div class="form-group">
                <label for="registerConfirm" class="form-label"
                  >Confirm Password</label
                >
                <input
                  type="password"
                  id="registerConfirm"
                  name="confirmPassword"
                  class="form-input"
                  placeholder="Confirm password"
                  autocomplete="new-password"
                  minlength="6"
                  required
                />
              </div>

              <div class="form-group checkbox">
                <input
                  type="checkbox"
                  id="agreeTerms"
                  name="agreeTerms"
                  class="form-checkbox"
                  required
                />
                <label for="agreeTerms" class="checkbox-label">
                  I agree with terms and conditions
                </label>
              </div>

              <button type="submit" class="submit-btn">Create Account</button>
            </fieldset>

            <p class="form-message" id="registerMessage"></p>
          </form>
        </div>
      </main>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
  </body>
</html>
